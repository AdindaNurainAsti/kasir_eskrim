<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2e6f52" />
    <title>Pesan</title>

    <link rel="stylesheet" href="pesan.css" />
    <link rel="stylesheet" href="tema.css" />
  </head>

  <body>
    <!-- Header, filter kategori, dan daftar menu dibuat oleh js/pesan.js -->
    <div id="a"></div>

    <!-- Bar total: muncul setelah ada item di keranjang -->
    <div id="bar" onclick="sh('c')">
      <div>
        <small id="bc"></small>
        <b id="bt"></b>
      </div>
      <span class="btn">Lihat keranjang</span>
    </div>

    <!-- Lembar bawah: detail menu dan keranjang -->
    <div id="sh">
      <div class="bk" onclick="cl()"></div>
      <div class="pn" id="pn" role="dialog" aria-modal="true"></div>
    </div>

    <script src="pesan.js"></script>
  </body>
</html>
